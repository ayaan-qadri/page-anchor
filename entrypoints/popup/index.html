<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Anchor</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body class="w-[320px] bg-slate-900 text-slate-100 font-sans text-[13px] select-none m-0 p-0 antialiased">
    <main class="pa-popup p-4 flex flex-col gap-3.5">
      <!-- Header -->
      <header class="pa-popup-header flex items-center justify-between pb-1 border-b border-white/[0.08]">
        <div class="pa-brand flex items-center gap-2.5">
          <div class="pa-brand-icon w-[34px] h-[34px] rounded-[10px] bg-gradient-to-br from-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="5" r="3"/>
              <line x1="12" y1="22" x2="12" y2="8"/>
              <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
            </svg>
          </div>
          <div>
            <h1 class="pa-brand-title text-sm font-bold text-white leading-tight">Page Anchor</h1>
            <p class="pa-brand-subtitle text-[11px] text-slate-400">Web Drawing & Annotations</p>
          </div>
        </div>
        <button id="btn-options" class="pa-icon-btn w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white bg-transparent hover:bg-white/[0.08] border border-white/10 transition-colors cursor-pointer focus-visible:outline-2 focus-visible:outline-sky-400" title="Open Full Settings" aria-label="Open Full Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </header>

      <!-- Current Page Card -->
      <div class="pa-card bg-white/[0.04] border border-white/[0.08] rounded-xl p-3 flex flex-col gap-2">
        <div class="pa-card-row flex items-center justify-between">
          <label for="toggle-draw-mode" class="pa-card-label font-semibold text-slate-100 text-[13px] cursor-pointer">Drawing Toolbar</label>
          <label class="relative inline-flex items-center cursor-pointer select-none">
            <input type="checkbox" id="toggle-draw-mode" class="sr-only peer" aria-label="Toggle drawing toolbar on current page" />
            <div class="w-11 h-6 bg-white/15 peer-focus-visible:ring-2 peer-focus-visible:ring-sky-400 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-900 rounded-full peer peer-checked:bg-blue-600 transition-colors after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:bg-white after:rounded-full after:h-[18px] after:w-[18px] after:transition-transform after:duration-200 peer-checked:after:translate-x-5 shadow-inner"></div>
          </label>
        </div>
        <div class="pa-page-info flex flex-col gap-0.5 pt-2 border-t border-white/[0.06]">
          <div class="pa-page-title text-xs text-slate-300 truncate" id="page-title">Loading page...</div>
          <div class="pa-page-count text-[11px] font-semibold text-sky-400" id="annotation-count" aria-live="polite">0 annotations</div>
        </div>
      </div>

      <!-- Actions -->
      <div class="pa-actions-grid grid grid-cols-2 gap-2.5">
        <button id="btn-export" class="pa-action-card flex items-center gap-2.5 p-2.5 bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-white/15 rounded-[10px] cursor-pointer text-left transition-all hover:-translate-y-0.5 focus-visible:outline-2 focus-visible:outline-sky-400">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <div class="pa-action-text flex flex-col">
            <span class="pa-action-title text-xs font-semibold text-slate-100">Export PNG</span>
            <span class="pa-action-sub text-[10px] text-slate-400">Download snapshot</span>
          </div>
        </button>

        <button id="btn-clear" class="pa-action-card flex items-center gap-2.5 p-2.5 bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] hover:border-white/15 rounded-[10px] cursor-pointer text-left transition-all hover:-translate-y-0.5 focus-visible:outline-2 focus-visible:outline-sky-400">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
          <div class="pa-action-text flex flex-col">
            <span class="pa-action-title text-xs font-semibold text-slate-100">Clear Page</span>
            <span class="pa-action-sub text-[10px] text-slate-400">Delete drawings</span>
          </div>
        </button>
      </div>

      <!-- Shortcut Hint -->
      <div class="pa-hint-box flex items-center justify-between px-3 py-2 bg-blue-500/[0.08] border border-blue-500/20 rounded-lg text-[11px] text-blue-300" role="note">
        <span>Quick Toggle:</span>
        <kbd id="quick-shortcut-hint" class="bg-slate-900/80 border border-white/20 rounded px-1.5 py-0.5 font-mono font-bold text-white">Alt + Shift + D</kbd>
      </div>

      <!-- Screen reader announcer -->
      <div id="popup-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
