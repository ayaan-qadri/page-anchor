name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and unit tests
        run: pnpm check

      - name: Production build (Chrome MV3)
        run: pnpm build

  e2e:
    # Separate job so a flaky browser test reports independently of the unit
    # suite, and so unit failures stop the run before the browser download.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build (Chrome MV3)
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Downloads are skipped when the cache above hits; --with-deps still needs
      # to run so the runner has Chromium's system libraries.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The fixture launches a headed Chromium with the built extension loaded,
      # which needs a virtual display on Linux. One retry absorbs runner flake.
      - name: End-to-end tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm test:e2e --retries=1
